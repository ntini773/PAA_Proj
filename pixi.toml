[workspace]
name = "pixart-nvfp4-rtx5000"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
# Host driver must expose CUDA 13. torch cu130 wheels bring their own CUDA
# runtime libs, so the server's nvcc 13.3 is NOT used by PyTorch/Triton.
cuda = "13.0"

[dependencies]
python = "3.11.*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/nightly/cu130"]

# Exact versions of the stack validated locally on the RTX 5060 (SM120).
# NVFP4 needs a recent torch + torchao nightly; both pins were still on the
# nightly index on 2026-10-18.
[pypi-dependencies]
torch        = { version = "==2.15.0.dev20260819+cu130", index = "https://download.pytorch.org/whl/nightly/cu130" }
torchao      = { version = "==0.19.0.dev20260920+cu130", index = "https://download.pytorch.org/whl/nightly/cu130" }
triton       = { version = "==3.8.0+gitdf3f91dd", index = "https://download.pytorch.org/whl/nightly/cu130" }
diffusers    = "==0.37.1"
transformers = "==4.56.1"
accelerate   = "==1.15.0"
huggingface_hub = "==0.34.4"
safetensors  = "==0.6.2"
numpy        = "*"
pillow       = "*"

[tasks]
gpucheck = "python -c \"import torch;print('torch',torch.__version__,'cuda',torch.version.cuda);print('gpu',torch.cuda.get_device_name(0));print('cap',torch.cuda.get_device_capability(0));print('mem GB',torch.cuda.get_device_properties(0).total_memory/2**30)\""
download = "python download_models.py"
smoke    = "python scale_e2e.py --size 256 --mode fused --steps 4 --reps 1 --out results/smoke"
tier1    = "python sweep_tier1.py"
